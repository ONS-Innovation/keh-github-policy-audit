[project]
name = "github-policy-audit"
version = "1.0.0"
description = "A tool used to audit GitHub Organisations for compliance with ONS' GitHub Usage Policy."
authors = [
    {name = "ONS-Innovation/keh-dev"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "policy-methods-library @ git+https://github.com/ONS-Innovation/keh-policy-methods-library.git",
    "boto3 (>=1.43.40,<2.0.0)"
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocstrings-python = "^1.16.12"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
mypy = "^1.20.2"
cryptography = "^48.0.0"
types-requests = "^2.33.0.20260503"

[tool.pytest.ini_options]
pythonpath = ["github_policy_audit"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["github_policy_audit"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["policy_methods_library", "policy_methods_library.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
repository = "http://github.com/ONS-Innovation/keh-github-policy-audit"
