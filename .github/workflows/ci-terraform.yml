---
name: Terraform CI
on:
  push:
    branches: [main]
    paths:
      - terraform/**
  pull_request:
    branches: [main]
    paths:
      - terraform/**
permissions:
  contents: read
jobs:
  terraform-validate:
    name: Format and Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # V4.3.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # V4.0.1

      - name: Install Poetry
        run: pipx install poetry
        working-directory: .

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # V5.6.0
        with:
          python-version-file: ".python-version"
          cache: poetry

      - name: Build Lambda artefacts
        run: make build
        working-directory: .

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  terraform-test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # V4.3.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # V4.0.1

      - name: Terraform init
        run: terraform init -backend=false

      - name: Install Poetry
        run: pipx install poetry
        working-directory: .

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # V5.6.0
        with:
          python-version-file: ".python-version"
          cache: poetry

      - name: Build Lambda artefacts
        run: make build
        working-directory: .

      - name: Terraform test
        run: terraform test
